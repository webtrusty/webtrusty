<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020817"/><stop offset="1" stop-color="#071b45"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07172f"/><stop offset="1" stop-color="#061d48"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#39aaff"/><stop offset=".5" stop-color="#00c8ff"/><stop offset="1" stop-color="#1688ff"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
    <path d="M80 0H0V80" fill="none" stroke="#3b82f6" stroke-opacity=".10"/>
    <circle cx="0" cy="0" r="2" fill="#38bdf8" opacity=".22"/>
  </pattern>
  <style>
    .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .label{font-size:18px;letter-spacing:7px;fill:#54b8ff}
    .title{font-size:50px;font-weight:800;fill:#f7faff}
    .sub{font-size:19px;fill:#a9bdd9}
    .num{font-size:15px;letter-spacing:4px;fill:#39aaff}
    .cardtitle{font-size:18px;font-weight:750;letter-spacing:.3px;fill:#f5f8ff}
    .desc{font-size:16px;fill:#a9c2e1}
  </style>
</defs>

<!-- Background -->
<rect width="1600" height="900" fill="#020712"/>
<rect x="16" y="28" width="1568" height="844" rx="34" fill="url(#bg)"/>
<rect x="16" y="28" width="1568" height="844" rx="34" fill="url(#grid)"/>

<!-- Ambient glows -->
<ellipse cx="1340" cy="170" rx="330" ry="230" fill="#0969ff" opacity=".10" filter="url(#soft)">
  <animate attributeName="opacity" values=".05;.13;.05" dur="7s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="800" cy="760" rx="500" ry="100" fill="#008cff" opacity=".07" filter="url(#soft)">
  <animate attributeName="opacity" values=".04;.10;.04" dur="8s" repeatCount="indefinite"/>
</ellipse>

<!-- Main frame -->
<rect x="48" y="64" width="1504" height="772" rx="34" fill="none" stroke="url(#cyan)" stroke-width="2" opacity=".95"/>
<rect x="49" y="65" width="1502" height="770" rx="33" fill="none" stroke="#37aaff" stroke-width="10" opacity=".05" filter="url(#glow)"/>
<path d="M85 111H1515" stroke="#2aa7ff" opacity=".12"/>

<!-- Header -->
<g class="sans">
  <text x="104" y="136" class="label">SERVICES</text>
  <path d="M309 133h80" stroke="#27b4ff" stroke-width="3">
    <animate attributeName="stroke-dasharray" values="0 80;80 0;0 80" dur="5s" repeatCount="indefinite"/>
  </path>
  <text x="104" y="202" class="title">What I Build <tspan fill="#19a8ff">for You</tspan></text>
  <text x="104" y="242" class="sub">Premium digital experiences, scalable products, and automation built around your goals.</text>
</g>

<!-- Network mark -->
<g fill="none" stroke="#168cff" stroke-width="2" opacity=".55">
 <circle cx="1450" cy="145" r="38"/><circle cx="1370" cy="205" r="25"/><circle cx="1520" cy="205" r="25"/>
 <path d="M1420 169L1387 194M1480 169L1505 194"/>
 <circle cx="1450" cy="145" r="5" fill="#27aaff"/>
 <circle cx="1370" cy="205" r="4" fill="#27aaff"/>
 <circle cx="1520" cy="205" r="4" fill="#27aaff"/>
 <circle cx="1450" cy="145" r="5" fill="#27aaff">
   <animate attributeName="r" values="5;9;5" dur="2.8s" repeatCount="indefinite"/>
 </circle>
</g>

<!-- Cards: all descriptions are clipped within their own card -->
<g class="sans">
  <!-- card 1 -->
  <g>
    <rect x="92" y="300" width="450" height="208" rx="24" fill="url(#panel)" stroke="#158dff" stroke-width="1.5"/>
    <rect x="93" y="301" width="448" height="206" rx="23" fill="none" stroke="#38baff" stroke-opacity=".10"/>
    <rect x="123" y="335" width="78" height="78" rx="17" fill="#071d3d" stroke="#2a9cff" stroke-width="1.5"/>
    <g transform="translate(142 354)" fill="none" stroke="#78c8ff" stroke-width="3">
      <rect x="0" y="0" width="40" height="28" rx="3"/><path d="M8 36h24M20 28v8"/>
    </g>
    <text x="226" y="350" class="num mono">01</text>
    <text x="226" y="379" class="cardtitle">WEBSITE DESIGN</text>
    <text x="226" y="408" class="desc">
      <tspan x="226" dy="0">Modern, responsive, conversion-focused</tspan>
      <tspan x="226" dy="23">websites built for performance.</tspan>
    </text>
    <path d="M94 485H540" stroke="#1e8eff" stroke-opacity=".18"/>
    <rect x="92" y="300" width="450" height="208" rx="24" fill="none" stroke="#45b8ff" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;.8;0" dur="5.5s" begin=".2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- card 2 -->
  <g>
    <rect x="575" y="300" width="450" height="208" rx="24" fill="url(#panel)" stroke="#158dff" stroke-width="1.5"/>
    <rect x="606" y="335" width="78" height="78" rx="17" fill="#071d3d" stroke="#2a9cff" stroke-width="1.5"/>
    <g transform="translate(627 353)" fill="none" stroke="#78c8ff" stroke-width="3">
      <rect x="0" y="0" width="36" height="43" rx="3"/><path d="M7 12h22M7 21h22M7 30h14"/>
    </g>
    <text x="709" y="350" class="num mono">02</text>
    <text x="709" y="379" class="cardtitle">LANDING PAGES</text>
    <text x="709" y="408" class="desc">
      <tspan x="709" dy="0">Focused pages designed to turn</tspan>
      <tspan x="709" dy="23">visitors into qualified leads.</tspan>
    </text>
    <rect x="575" y="300" width="450" height="208" rx="24" fill="none" stroke="#45b8ff" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;.8;0" dur="5.5s" begin=".8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- card 3 -->
  <g>
    <rect x="1058" y="300" width="450" height="208" rx="24" fill="url(#panel)" stroke="#158dff" stroke-width="1.5"/>
    <rect x="1089" y="335" width="78" height="78" rx="17" fill="#071d3d" stroke="#2a9cff" stroke-width="1.5"/>
    <g transform="translate(1110 352)" fill="none" stroke="#78c8ff" stroke-width="3">
      <path d="M5 16h36l-5-11H10z"/><path d="M7 16v30h32V16"/><path d="M5 22h36"/>
    </g>
    <text x="1192" y="350" class="num mono">03</text>
    <text x="1192" y="379" class="cardtitle">E-COMMERCE</text>
    <text x="1192" y="408" class="desc">
      <tspan x="1192" dy="0">Fast storefronts with clean product</tspan>
      <tspan x="1192" dy="23">experiences built to convert.</tspan>
    </text>
    <rect x="1058" y="300" width="450" height="208" rx="24" fill="none" stroke="#45b8ff" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;.8;0" dur="5.5s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- card 4 -->
  <g>
    <rect x="92" y="536" width="450" height="208" rx="24" fill="url(#panel)" stroke="#158dff" stroke-width="1.5"/>
    <rect x="123" y="571" width="78" height="78" rx="17" fill="#071d3d" stroke="#2a9cff" stroke-width="1.5"/>
    <g transform="translate(141 589)" fill="none" stroke="#78c8ff" stroke-width="3">
      <circle cx="12" cy="12" r="9"/><circle cx="40" cy="40" r="9"/><path d="M19 19l14 14"/>
    </g>
    <text x="226" y="586" class="num mono">04</text>
    <text x="226" y="615" class="cardtitle">UI / UX DESIGN</text>
    <text x="226" y="644" class="desc">
      <tspan x="226" dy="0">Interfaces that feel polished,</tspan>
      <tspan x="226" dy="23">intuitive, and premium.</tspan>
    </text>
    <rect x="92" y="536" width="450" height="208" rx="24" fill="none" stroke="#45b8ff" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;.8;0" dur="5.5s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- card 5 -->
  <g>
    <rect x="575" y="536" width="450" height="208" rx="24" fill="url(#panel)" stroke="#158dff" stroke-width="1.5"/>
    <rect x="606" y="571" width="78" height="78" rx="17" fill="#071d3d" stroke="#2a9cff" stroke-width="1.5"/>
    <g transform="translate(624 588)" fill="none" stroke="#78c8ff" stroke-width="3">
      <path d="M39 10A27 27 0 1 0 45 34"/><path d="M44 9v14H30"/>
    </g>
    <text x="709" y="586" class="num mono">05</text>
    <text x="709" y="615" class="cardtitle">MAINTENANCE &amp; SEO</text>
    <text x="709" y="644" class="desc">
      <tspan x="709" dy="0">Ongoing improvements, performance,</tspan>
      <tspan x="709" dy="23">security, and search visibility.</tspan>
    </text>
    <rect x="575" y="536" width="450" height="208" rx="24" fill="none" stroke="#45b8ff" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;.8;0" dur="5.5s" begin="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- card 6 -->
  <g>
    <rect x="1058" y="536" width="450" height="208" rx="24" fill="url(#panel)" stroke="#158dff" stroke-width="1.5"/>
    <rect x="1089" y="571" width="78" height="78" rx="17" fill="#071d3d" stroke="#2a9cff" stroke-width="1.5"/>
    <g transform="translate(1108 590)" fill="none" stroke="#78c8ff" stroke-width="3">
      <rect x="3" y="3" width="38" height="38" rx="7"/><path d="M12 3V0M23 3V0M34 3V0M12 44v-3M23 44v-3M34 44v-3M3 12H0M3 23H0M3 34H0M44 12h-3M44 23h-3M44 34h-3"/>
      <path d="M15 23l6 6 9-12"/>
    </g>
    <text x="1192" y="586" class="num mono">06</text>
    <text x="1192" y="615" class="cardtitle">AI AUTOMATION</text>
    <text x="1192" y="644" class="desc">
      <tspan x="1192" dy="0">Smart workflows that reduce</tspan>
      <tspan x="1192" dy="23">repetitive manual work.</tspan>
    </text>
    <rect x="1058" y="536" width="450" height="208" rx="24" fill="none" stroke="#45b8ff" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;.8;0" dur="5.5s" begin="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</g>

<!-- Footer -->
<g class="mono">
 <path d="M104 782H1496" stroke="#208dff" stroke-opacity=".45"/>
 <circle cx="800" cy="782" r="5" fill="#39aaff" filter="url(#glow)">
   <animate attributeName="r" values="4;9;4" dur="2.4s" repeatCount="indefinite"/>
 </circle>
 <text x="104" y="818" font-size="15" letter-spacing="5" fill="#8ea8c9">WEBTRUSTY  •  DESIGN  •  DEVELOPMENT  •  AUTOMATION</text>
</g>

<!-- Moving scan line -->
<rect x="80" y="82" width="1440" height="3" rx="2" fill="#38b8ff" opacity="0">
 <animate attributeName="y" values="82;820;82" dur="10s" repeatCount="indefinite"/>
 <animate attributeName="opacity" values="0;.16;0" dur="10s" repeatCount="indefinite"/>
</rect>
</svg>