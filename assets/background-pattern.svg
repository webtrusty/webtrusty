<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
<defs>
<pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
<path d="M80 0H0V80" fill="none" stroke="#60A5FA" stroke-opacity=".08" stroke-width="1"/>
<circle cx="0" cy="0" r="2" fill="#60A5FA" fill-opacity=".18"/>
</pattern>
<pattern id="micro" width="20" height="20" patternUnits="userSpaceOnUse">
<circle cx="10" cy="10" r=".8" fill="#93C5FD" fill-opacity=".18"/>
</pattern>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#3B82F6" stop-opacity=".18"/>
<stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
</linearGradient>
</defs>
<rect width="800" height="800" fill="#020617"/>
<rect width="800" height="800" fill="url(#grid)"/>
<rect width="800" height="800" fill="url(#micro)"/>
<circle cx="120" cy="120" r="220" fill="url(#fade)">
<animate attributeName="opacity" values=".6;1;.6" dur="12s" repeatCount="indefinite"/>
</circle>
<circle cx="700" cy="700" r="260" fill="url(#fade)">
<animate attributeName="opacity" values=".8;.4;.8" dur="14s" repeatCount="indefinite"/>
</circle>
<g stroke="#60A5FA" stroke-opacity=".18">
<line x1="180" y1="180" x2="260" y2="180"/>
<line x1="180" y1="180" x2="180" y2="260"/>
<line x1="620" y1="620" x2="540" y2="620"/>
<line x1="620" y1="620" x2="620" y2="540"/>
</g>
</svg>
