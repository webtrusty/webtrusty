<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>WebTrusty Contact Card</title>
  <desc>Animated premium dark-blue contact card for WebTrusty with email, website, work hours, location, and freelance status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.55" stop-color="#061936"/>
      <stop offset="1" stop-color="#03102a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06142c"/>
      <stop offset="1" stop-color="#071d43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1688ff"/>
      <stop offset="0.5" stop-color="#54b9ff"/>
      <stop offset="1" stop-color="#1688ff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="statusIconClip">
      <rect x="1200" y="566" width="82" height="82" rx="18"/>
    </clipPath>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#4b9cff" stroke-opacity=".10"/>
      <circle cx="0" cy="0" r="2.2" fill="#55adff" fill-opacity=".22"/>
    </pattern>
    <style>
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;letter-spacing:6px;fill:#4db1ff}
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:62px;font-weight:750;fill:#f7faff}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;fill:#b9c9df}
      .cardTitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;letter-spacing:2px;fill:#4db1ff}
      .value{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:650;fill:#f3f7ff}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;fill:#a9bdd8}
      .footer{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;letter-spacing:4px;fill:#8ba4c5}
      .iconBox{fill:#081b38;stroke:#147eff;stroke-width:2}
      .card{fill:#06162f;fill-opacity:.78;stroke:#126bd8;stroke-width:2}
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="1250" cy="220" rx="420" ry="260" fill="#0b52c9" opacity=".10" filter="url(#soft)">
    <animate attributeName="opacity" values=".06;.14;.06" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Main panel -->
  <rect x="48" y="74" width="1504" height="752" rx="42" fill="url(#panel)" stroke="#1688ff" stroke-width="2.5"/>
  <rect x="49" y="75" width="1502" height="750" rx="41" fill="url(#grid)"/>

  <!-- Animated border glow -->
  <rect x="48" y="74" width="1504" height="752" rx="42" fill="none" stroke="#28a0ff" stroke-width="5" opacity=".12" filter="url(#glow)">
    <animate attributeName="opacity" values=".08;.35;.08" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Header -->
  <text x="112" y="160" class="label">CONTACT</text>
  <path d="M305 151h70" stroke="#35a9ff" stroke-width="3">
    <animate attributeName="stroke-width" values="2;5;2" dur="3s" repeatCount="indefinite"/>
  </path>
  <text x="108" y="244" class="title">Let's Build Something <tspan fill="#38aaff">Great</tspan></text>
  <text x="110" y="295" class="sub">Have a project, idea, or opportunity? Let's connect and discuss how we can work together.</text>

  <!-- Decorative network -->
  <g fill="none" stroke="#1886ff" stroke-width="2" opacity=".55">
    <circle cx="1455" cy="178" r="38"/>
    <circle cx="1385" cy="258" r="24"/>
    <circle cx="1520" cy="258" r="24"/>
    <path d="M1433 206L1398 241M1477 206L1504 240"/>
    <circle cx="1455" cy="178" r="5" fill="#39a9ff" filter="url(#glow)">
      <animate attributeName="r" values="4;9;4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Email large card -->
  <rect x="108" y="360" width="590" height="320" rx="28" class="card"/>
  <rect x="142" y="394" width="92" height="92" rx="20" class="iconBox"/>
  <g fill="none" stroke="#77c4ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="162" y="421" width="52" height="38" rx="5"/>
    <path d="M163 423l25 21 25-21"/>
  </g>
  <text x="262" y="425" class="cardTitle">EMAIL</text>
  <text x="262" y="465" class="value">sahiblaskar003@gmail.com</text>
  <line x1="142" y1="555" x2="650" y2="555" stroke="#1c4c83" stroke-width="2"/>
  <circle cx="164" cy="607" r="9" fill="#45aaff" filter="url(#glow)">
    <animate attributeName="r" values="7;12;7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="190" y="614" class="small">Usually replies within 24 hours</text>

  <!-- Website -->
  <rect x="730" y="360" width="410" height="145" rx="25" class="card"/>
  <rect x="760" y="391" width="82" height="82" rx="18" class="iconBox"/>
  <circle cx="801" cy="432" r="24" fill="none" stroke="#83caff" stroke-width="3"/>
  <path d="M777 432h48M801 408c9 10 9 38 0 48M801 408c-9 10-9 38 0 48" fill="none" stroke="#83caff" stroke-width="3"/>
  <text x="875" y="420" class="cardTitle">WEBSITE</text>
  <text x="875" y="462" class="value">webtrusty.vercel.app</text>

  <!-- Location -->
  <rect x="730" y="535" width="410" height="145" rx="25" class="card"/>
  <rect x="760" y="566" width="82" height="82" rx="18" class="iconBox"/>
  <path d="M801 591c-15 0-25 11-25 24 0 18 25 38 25 38s25-20 25-38c0-13-10-24-25-24z" fill="none" stroke="#83caff" stroke-width="3"/>
  <circle cx="801" cy="615" r="7" fill="none" stroke="#83caff" stroke-width="3"/>
  <text x="875" y="595" class="cardTitle">LOCATION</text>
  <text x="875" y="637" class="value">Kolkata, India</text>

  <!-- Current status -->
  <rect x="1170" y="535" width="335" height="145" rx="25" class="card"/>
  <rect x="1200" y="566" width="82" height="82" rx="18" class="iconBox"/>
  <circle cx="1241" cy="607" r="25" fill="none" stroke="#147eff" stroke-width="3"/>
  <g clip-path="url(#statusIconClip)">
    <circle cx="1241" cy="607" r="14" fill="#4db1ff" filter="url(#glow)">
      <animate attributeName="opacity" values=".55;1;.55" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="1315" y="595" class="cardTitle">STATUS</text>
  <text x="1315" y="617" class="value" font-size="15">Available for</text>
  <text x="1315" y="639" class="value" font-size="15">Freelance &amp;</text>
  <text x="1315" y="661" class="value" font-size="15">Remote Work</text>

  <!-- Work hours -->
  <rect x="1170" y="360" width="335" height="145" rx="25" class="card"/>
  <rect x="1200" y="391" width="82" height="82" rx="18" class="iconBox"/>
  <circle cx="1241" cy="432" r="25" fill="none" stroke="#83caff" stroke-width="3"/>
  <path d="M1241 417v17l11 8" fill="none" stroke="#83caff" stroke-width="3" stroke-linecap="round"/>
  <text x="1315" y="420" class="cardTitle">WORK HOURS</text>
  <text x="1315" y="453" class="value" font-size="18">Mon – Sat</text>
  <text x="1315" y="480" class="small">5 PM – 11 PM</text>


  <!-- Subtle animated card accents -->
  <g fill="none" stroke="#3aa9ff" stroke-width="2" opacity=".22">
    <rect x="108" y="360" width="590" height="320" rx="28">
      <animate attributeName="opacity" values=".12;.32;.12" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="730" y="360" width="410" height="145" rx="25">
      <animate attributeName="opacity" values=".10;.28;.10" dur="4.2s" begin=".4s" repeatCount="indefinite"/>
    </rect>
    <rect x="730" y="535" width="410" height="145" rx="25">
      <animate attributeName="opacity" values=".10;.28;.10" dur="4.8s" begin=".8s" repeatCount="indefinite"/>
    </rect>
    <rect x="1170" y="360" width="335" height="145" rx="25">
      <animate attributeName="opacity" values=".10;.28;.10" dur="4.5s" begin="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="1170" y="535" width="335" height="145" rx="25">
      <animate attributeName="opacity" values=".10;.32;.10" dur="4.6s" begin=".6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Divider -->
  <line x1="108" y1="734" x2="1492" y2="734" stroke="#176bc4" stroke-width="2"/>
  <circle cx="800" cy="734" r="5" fill="#47b4ff" filter="url(#glow)">
    <animate attributeName="r" values="4;10;4" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="108" y="785" class="footer">WEBTRUSTY  •  DESIGN  •  DEVELOPMENT  •  AUTOMATION</text>

  <!-- Subtle animated scan -->
  <rect x="70" y="90" width="1460" height="4" rx="2" fill="#39aaff" opacity=".0">
    <animate attributeName="y" values="90;805;90" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.14;0" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>