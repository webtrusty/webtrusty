<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="200"
     viewBox="0 0 1600 200">

  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#08142C"/>
    </linearGradient>

    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>

  </defs>

  <!-- Background -->

  <rect
      width="1600"
      height="200"
      fill="url(#bg)"/>

  <!-- Blueprint Grid -->

  <g opacity="0.06">

    <path d="M0 40H1600"/>
    <path d="M0 80H1600"/>
    <path d="M0 120H1600"/>
    <path d="M0 160H1600"/>

    <path d="M200 0V200"/>
    <path d="M400 0V200"/>
    <path d="M600 0V200"/>
    <path d="M800 0V200"/>
    <path d="M1000 0V200"/>
    <path d="M1200 0V200"/>
    <path d="M1400 0V200"/>

  </g>

  <!-- Corner Decorations -->

  <circle cx="90" cy="40" r="3" fill="#60A5FA"/>
  <circle cx="1500" cy="45" r="3" fill="#60A5FA"/>
  <circle cx="132" cy="155" r="2" fill="#2563EB"/>
  <circle cx="1460" cy="160" r="2" fill="#2563EB"/>

  <!-- Accent Lines -->

  <line
      x1="0"
      y1="0"
      x2="240"
      y2="0"
      stroke="#2563EB"
      stroke-width="2"/>

  <line
      x1="1360"
      y1="200"
      x2="1600"
      y2="200"
      stroke="#2563EB"
      stroke-width="2"/>

  <!-- Label -->

  <text
      x="800"
      y="55"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      font-weight="700"
      letter-spacing="7"
      fill="#60A5FA">

      SECTION

  </text>

  <!-- Title -->

  <text
      x="800"
      y="106"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="42"
      font-weight="700"
      fill="#FFFFFF">

      TITLE

  </text>

  <!-- Subtitle -->

  <text
      x="800"
      y="135"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="15"
      fill="#94A3B8">

      Subtitle

  </text>

  <!-- Divider -->

  <line
      x1="620"
      y1="168"
      x2="770"
      y2="168"
      stroke="url(#line)"
      stroke-width="2"/>

  <circle
      cx="800"
      cy="168"
      r="4"
      fill="#60A5FA"/>

  <line
      x1="830"
      y1="168"
      x2="980"
      y2="168"
      stroke="url(#line)"
      stroke-width="2"/>

</svg>
