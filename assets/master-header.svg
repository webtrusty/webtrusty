<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="200"
     viewBox="0 0 1600 200">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#08142C"/>
    </linearGradient>

    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="200" fill="url(#bg)"/>

  <!-- Corner accents -->
  <circle cx="120" cy="45" r="3" fill="#60A5FA"/>
  <circle cx="1480" cy="155" r="3" fill="#60A5FA"/>
  <circle cx="250" cy="165" r="2" fill="#2563EB"/>
  <circle cx="1350" cy="35" r="2" fill="#2563EB"/>

  <!-- Top label -->
  <text
      x="800"
      y="58"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="14"
      letter-spacing="6"
      font-weight="700"
      fill="#60A5FA">
      SECTION
  </text>

  <!-- Main title -->
  <text
      x="800"
      y="108"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="42"
      font-weight="700"
      fill="#FFFFFF">
      TITLE
  </text>

  <!-- Subtitle -->
  <text
      x="800"
      y="138"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="16"
      fill="#94A3B8">
      Subtitle
  </text>

  <!-- Divider -->
  <line
      x1="610"
      y1="170"
      x2="770"
      y2="170"
      stroke="url(#line)"
      stroke-width="2"/>

  <circle
      cx="800"
      cy="170"
      r="4"
      fill="#60A5FA"/>

  <line
      x1="830"
      y1="170"
      x2="990"
      y2="170"
      stroke="url(#line)"
      stroke-width="2"/>

</svg>
