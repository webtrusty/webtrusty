<?xml version="1.0" encoding="UTF-8"?>
<svg
xmlns="http://www.w3.org/2000/svg"
width="1600"
height="260"
viewBox="0 0 1600 260">

<defs>

<!-- Background -->

<linearGradient id="bg"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#030712"/>
<stop offset="45%" stop-color="#081326"/>
<stop offset="100%" stop-color="#0B1E38"/>

</linearGradient>

<!-- Aurora -->

<radialGradient id="aurora1">

<stop offset="0%" stop-color="#3B82F6" stop-opacity=".18"/>
<stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>

</radialGradient>

<radialGradient id="aurora2">

<stop offset="0%" stop-color="#2563EB" stop-opacity=".10"/>
<stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>

</radialGradient>

<!-- Glass -->

<linearGradient id="glass"
x1="0%"
y1="0%"
x2="0%"
y2="100%">

<stop offset="0%"
stop-color="#FFFFFF"
stop-opacity=".07"/>

<stop offset="100%"
stop-color="#FFFFFF"
stop-opacity=".02"/>

</linearGradient>

<!-- Border -->

<linearGradient id="border"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%"
stop-color="#60A5FA00"/>

<stop offset="50%"
stop-color="#60A5FA"/>

<stop offset="100%"
stop-color="#60A5FA00"/>

</linearGradient>

</defs>

<!-- Background -->

<rect
width="1600"
height="260"
fill="url(#bg)"/>

<!-- Aurora -->

<circle
cx="250"
cy="40"
r="260"
fill="url(#aurora1)"/>

<circle
cx="1450"
cy="240"
r="300"
fill="url(#aurora2)"/>

<!-- Blueprint Grid -->

<g
stroke="#60A5FA"
stroke-opacity=".045"
stroke-width="1">

<!-- Horizontal -->

<path d="M0 40H1600"/>
<path d="M0 80H1600"/>
<path d="M0 120H1600"/>
<path d="M0 160H1600"/>
<path d="M0 200H1600"/>
<path d="M0 240H1600"/>

<!-- Vertical -->

<path d="M200 0V260"/>
<path d="M400 0V260"/>
<path d="M600 0V260"/>
<path d="M800 0V260"/>
<path d="M1000 0V260"/>
<path d="M1200 0V260"/>
<path d="M1400 0V260"/>

</g>

<!-- Glass Card -->

<rect

x="170"
y="28"

width="1260"
height="204"

rx="28"

fill="url(#glass)"

stroke="url(#border)"

stroke-width="1.4"/>

<!-- Inner Border -->

<rect

x="183"
y="41"

width="1234"
height="178"

rx="22"

fill="none"

stroke="#FFFFFF"

stroke-opacity=".05"/>

<!-- Reflection -->

<path

d="M210 55
H1390"

stroke="#FFFFFF"

stroke-opacity=".06"

stroke-width="1"/>

<!-- Corner System -->

<g stroke="#60A5FA" stroke-width="2">

<!-- TL -->

<path d="M170 58h28"/>
<path d="M170 58v28"/>

<!-- TR -->

<path d="M1430 58h-28"/>
<path d="M1430 58v28"/>

<!-- BL -->

<path d="M170 202h28"/>
<path d="M170 202v-28"/>

<!-- BR -->

<path d="M1430 202h-28"/>
<path d="M1430 202v-28"/>

</g>

<!-- Corner Dots -->

<g fill="#60A5FA">

<circle cx="120" cy="50" r="2"/>
<circle cx="1500" cy="60" r="2"/>

<circle cx="100" cy="210" r="2"/>
<circle cx="1490" cy="220" r="2"/>

</g>

<!-- Tiny Technical Lines -->

