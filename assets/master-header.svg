<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="240"
     viewBox="0 0 1600 240">

<defs>

<linearGradient id="bg"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#040814"/>
<stop offset="100%" stop-color="#081B34"/>

</linearGradient>

<linearGradient id="glass"
x1="0%"
y1="0%"
x2="0%"
y2="100%">

<stop offset="0%" stop-color="#1A3C6A" stop-opacity=".16"/>
<stop offset="100%" stop-color="#0B1328" stop-opacity=".35"/>

</linearGradient>

<linearGradient id="stroke"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%" stop-color="#2563EB00"/>
<stop offset="50%" stop-color="#60A5FA"/>
<stop offset="100%" stop-color="#2563EB00"/>

</linearGradient>

</defs>

<!-- Background -->

<rect
width="1600"
height="240"
fill="url(#bg)"/>

<!-- Blueprint Grid -->

<g
stroke="#60A5FA"
stroke-opacity=".05"
stroke-width="1">

<!-- Horizontal -->

<path d="M0 40H1600"/>
<path d="M0 80H1600"/>
<path d="M0 120H1600"/>
<path d="M0 160H1600"/>
<path d="M0 200H1600"/>

<!-- Vertical -->

<path d="M200 0V240"/>
<path d="M400 0V240"/>
<path d="M600 0V240"/>
<path d="M800 0V240"/>
<path d="M1000 0V240"/>
<path d="M1200 0V240"/>
<path d="M1400 0V240"/>

</g>

<!-- Corner Decorations -->

<line
x1="0"
y1="0"
x2="180"
y2="0"
stroke="#2563EB"
stroke-width="2"/>

<line
x1="0"
y1="0"
x2="0"
y2="80"
stroke="#2563EB"
stroke-width="2"/>

<line
x1="1420"
y1="240"
x2="1600"
y2="240"
stroke="#2563EB"
stroke-width="2"/>

<line
x1="1600"
y1="160"
x2="1600"
y2="240"
stroke="#2563EB"
stroke-width="2"/>

<!-- Main Glass Card -->

<rect

x="170"
y="24"

width="1260"
height="192"

rx="26"

fill="url(#glass)"

stroke="url(#stroke)"

stroke-width="1.4"/>

<!-- Inner Border -->

<rect

x="184"
y="38"

width="1232"
height="164"

rx="20"

fill="none"

stroke="#FFFFFF"

stroke-opacity=".04"/>

<!-- Tech Corners -->

<path
d="M170 58h22"

stroke="#60A5FA"

stroke-width="2"/>

<path
d="M170 58v22"

stroke="#60A5FA"

stroke-width="2"/>

<path
d="M1408 58h-22"

stroke="#60A5FA"

stroke-width="2"/>

<path
d="M1408 58v22"

stroke="#60A5FA"

stroke-width="2"/>

<path
d="M170 182h22"

stroke="#60A5FA"

stroke-width="2"/>

<path
d="M170 182v-22"

stroke="#60A5FA"

stroke-width="2"/>

<path
d="M1408 182h-22"

stroke="#60A5FA"

stroke-width="2"/>

<path
d="M1408 182v-22"

stroke="#60A5FA"

stroke-width="2"/>

</svg>
