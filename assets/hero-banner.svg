<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
xmlns:xlink="http://www.w3.org/1999/xlink"

width="1600"
height="420"

viewBox="0 0 1600 420"

fill="none">

<!-- ===================================================== -->
<!-- DEFINITIONS -->
<!-- ===================================================== -->

<defs>

<!-- Background -->

<linearGradient
id="bg"

x1="0"
y1="0"

x2="1600"
y2="420"

gradientUnits="userSpaceOnUse">

<stop
offset="0%"
stop-color="#030712"/>

<stop
offset="55%"
stop-color="#071224"/>

<stop
offset="100%"
stop-color="#0B1830"/>

</linearGradient>

<!-- Glass -->

<linearGradient
id="glass"

x1="0"
y1="0"

x2="0"
y2="1">

<stop
offset="0%"
stop-color="#FFFFFF"
stop-opacity=".07"/>

<stop
offset="100%"
stop-color="#FFFFFF"
stop-opacity=".025"/>

</linearGradient>

<!-- Border -->

<linearGradient
id="border"

x1="0"
y1="0"

x2="1"
y2="0">

<stop
offset="0%"
stop-color="#60A5FA00"/>

<stop
offset="50%"
stop-color="#60A5FA"/>

<stop
offset="100%"
stop-color="#60A5FA00"/>

</linearGradient>

<!-- Glow -->

<radialGradient
id="glowLeft">

<stop
offset="0%"
stop-color="#3B82F6"
stop-opacity=".18"/>

<stop
offset="100%"
stop-color="#3B82F6"
stop-opacity="0"/>

</radialGradient>

<radialGradient
id="glowRight">

<stop
offset="0%"
stop-color="#2563EB"
stop-opacity=".12"/>

<stop
offset="100%"
stop-color="#2563EB"
stop-opacity="0"/>

</radialGradient>

<!-- Noise -->

<filter id="noise">

<feTurbulence
type="fractalNoise"

baseFrequency=".9"

numOctaves="2"

seed="5"/>

<feColorMatrix
type="saturate"
values="0"/>

<feComponentTransfer>

<feFuncA
type="table"
tableValues="0 .03"/>

</feComponentTransfer>

</filter>

</defs>

<!-- ===================================================== -->
<!-- BACKGROUND -->
<!-- ===================================================== -->

<rect

width="1600"

height="420"

fill="url(#bg)"/>

<!-- Left Ambient -->

<circle

cx="220"

cy="60"

r="300"

fill="url(#glowLeft)"/>

<!-- Right Ambient -->

<circle

cx="1480"

cy="360"

r="340"

fill="url(#glowRight)"/>

<!-- ===================================================== -->
<!-- BLUEPRINT GRID -->
<!-- ===================================================== -->

<g

stroke="#60A5FA"

stroke-opacity=".045"

stroke-width="1">

<!-- Horizontal -->

<path d="M0 60H1600"/>
<path d="M0 120H1600"/>
<path d="M0 180H1600"/>
<path d="M0 240H1600"/>
<path d="M0 300H1600"/>
<path d="M0 360H1600"/>

<!-- Vertical -->

<path d="M200 0V420"/>
<path d="M400 0V420"/>
<path d="M600 0V420"/>
<path d="M800 0V420"/>
<path d="M1000 0V420"/>
<path d="M1200 0V420"/>
<path d="M1400 0V420"/>

</g>

<!-- ===================================================== -->
<!-- GLASS CONTAINER -->
<!-- ===================================================== -->

<rect

x="70"

y="40"

width="1460"

height="340"

rx="34"

fill="url(#glass)"

stroke="url(#border)"

stroke-width="1.2"/>

<!-- Inner Glass -->

<rect

x="86"

y="56"

width="1428"

height="308"

rx="26"

stroke="#FFFFFF"

stroke-opacity=".05"/>

<!-- Reflection -->

<path

d="M120 74H1480"

stroke="#FFFFFF"

stroke-opacity=".06"

stroke-width="1"/>

<!-- ===================================================== -->
<!-- CORNER SYSTEM -->
<!-- ===================================================== -->

<g

stroke="#60A5FA"

stroke-width="2">

<!-- TL -->

<path d="M70 72H104"/>
<path d="M70 72V106"/>

<!-- TR -->

<path d="M1530 72H1496"/>
<path d="M1530 72V106"/>

<!-- BL -->

<path d="M70 348H104"/>
<path d="M70 348V314"/>

<!-- BR -->

<path d="M1530 348H1496"/>
<path d="M1530 348V314"/>

</g>

<!-- ===================================================== -->
<!-- MICRO DETAILS -->
<!-- ===================================================== -->

<g opacity=".35">

<circle cx="118" cy="88" r="2" fill="#60A5FA"/>

<circle cx="1492" cy="88" r="2" fill="#60A5FA"/>

<circle cx="118" cy="332" r="2" fill="#60A5FA"/>

<circle cx="1492" cy="332" r="2" fill="#60A5FA"/>

<rect

x="520"

y="84"

width="8"

height="8"

transform="rotate(45 524 88)"

fill="#60A5FA"/>

<rect

x="1080"

y="300"

width="8"

height="8"

transform="rotate(45 1084 304)"

fill="#60A5FA"/>

</g>

<!-- ===================================================== -->
<!-- SUBTLE NOISE -->
<!-- ===================================================== -->

<rect

width="1600"

height="420"

filter="url(#noise)"

opacity=".20"/>

</svg>
