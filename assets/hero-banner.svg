<?xml version="1.0" encoding="UTF-8"?>

<svg
xmlns="http://www.w3.org/2000/svg"
xmlns:xlink="http://www.w3.org/1999/xlink"

width="1600"
height="420"

viewBox="0 0 1600 420"

fill="none">

<!-- ===================================================== -->
<!-- DEFINITIONS -->
<!-- ===================================================== -->

<defs>

<!-- Background -->

<linearGradient
id="bg"

x1="0"
y1="0"

x2="1600"
y2="420"

gradientUnits="userSpaceOnUse">

<stop
offset="0%"
stop-color="#030712"/>

<stop
offset="55%"
stop-color="#071224"/>

<stop
offset="100%"
stop-color="#0B1830"/>

</linearGradient>

<!-- Glass -->

<linearGradient
id="glass"

x1="0"
y1="0"

x2="0"
y2="1">

<stop
offset="0%"
stop-color="#FFFFFF"
stop-opacity=".07"/>

<stop
offset="100%"
stop-color="#FFFFFF"
stop-opacity=".025"/>

</linearGradient>

<!-- Border -->

<linearGradient
id="border"

x1="0"
y1="0"

x2="1"
y2="0">

<stop
offset="0%"
stop-color="#60A5FA00"/>

<stop
offset="50%"
stop-color="#60A5FA"/>

<stop
offset="100%"
stop-color="#60A5FA00"/>

</linearGradient>

<!-- Glow -->

<radialGradient
id="glowLeft">

<stop
offset="0%"
stop-color="#3B82F6"
stop-opacity=".18"/>

<stop
offset="100%"
stop-color="#3B82F6"
stop-opacity="0"/>

</radialGradient>

<radialGradient
id="glowRight">

<stop
offset="0%"
stop-color="#2563EB"
stop-opacity=".12"/>

<stop
offset="100%"
stop-color="#2563EB"
stop-opacity="0"/>

</radialGradient>

<!-- Noise -->

<filter id="noise">

<feTurbulence
type="fractalNoise"

baseFrequency=".9"

numOctaves="2"

seed="5"/>

<feColorMatrix
type="saturate"
values="0"/>

<feComponentTransfer>

<feFuncA
type="table"
tableValues="0 .03"/>

</feComponentTransfer>

</filter>

</defs>

<!-- ===================================================== -->
<!-- BACKGROUND -->
<!-- ===================================================== -->

<rect

width="1600"

height="420"

fill="url(#bg)"/>

<!-- Left Ambient -->

<circle

cx="220"

cy="60"

r="300"

fill="url(#glowLeft)"/>

<!-- Right Ambient -->

<circle

cx="1480"

cy="360"

r="340"

fill="url(#glowRight)"/>

<!-- ===================================================== -->
<!-- BLUEPRINT GRID -->
<!-- ===================================================== -->

<g

stroke="#60A5FA"

stroke-opacity=".045"

stroke-width="1">

<!-- Horizontal -->

<path d="M0 60H1600"/>
<path d="M0 120H1600"/>
<path d="M0 180H1600"/>
<path d="M0 240H1600"/>
<path d="M0 300H1600"/>
<path d="M0 360H1600"/>

<!-- Vertical -->

<path d="M200 0V420"/>
<path d="M400 0V420"/>
<path d="M600 0V420"/>
<path d="M800 0V420"/>
<path d="M1000 0V420"/>
<path d="M1200 0V420"/>
<path d="M1400 0V420"/>

</g>

<!-- ===================================================== -->
<!-- GLASS CONTAINER -->
<!-- ===================================================== -->

<rect

x="70"

y="40"

width="1460"

height="340"

rx="34"

fill="url(#glass)"

stroke="url(#border)"

stroke-width="1.2"/>

<!-- Inner Glass -->

<rect

x="86"

y="56"

width="1428"

height="308"

rx="26"

stroke="#FFFFFF"

stroke-opacity=".05"/>

<!-- Reflection -->

<path

d="M120 74H1480"

stroke="#FFFFFF"

stroke-opacity=".06"

stroke-width="1"/>

<!-- ===================================================== -->
<!-- CORNER SYSTEM -->
<!-- ===================================================== -->

<g

stroke="#60A5FA"

stroke-width="2">

<!-- TL -->

<path d="M70 72H104"/>
<path d="M70 72V106"/>

<!-- TR -->

<path d="M1530 72H1496"/>
<path d="M1530 72V106"/>

<!-- BL -->

<path d="M70 348H104"/>
<path d="M70 348V314"/>

<!-- BR -->

<path d="M1530 348H1496"/>
<path d="M1530 348V314"/>

</g>

<!-- ===================================================== -->
<!-- MICRO DETAILS -->
<!-- ===================================================== -->

<g opacity=".35">

<circle cx="118" cy="88" r="2" fill="#60A5FA"/>

<circle cx="1492" cy="88" r="2" fill="#60A5FA"/>

<circle cx="118" cy="332" r="2" fill="#60A5FA"/>

<circle cx="1492" cy="332" r="2" fill="#60A5FA"/>

<rect

x="520"

y="84"

width="8"

height="8"

transform="rotate(45 524 88)"

fill="#60A5FA"/>

<rect

x="1080"

y="300"

width="8"

height="8"

transform="rotate(45 1084 304)"

fill="#60A5FA"/>

</g>

<!-- ===================================================== -->
<!-- SUBTLE NOISE -->
<!-- ===================================================== -->

<rect

width="1600"

height="420"

filter="url(#noise)"

opacity=".20"/>

<!-- ===================================================== -->
<!-- BRAND -->
<!-- ===================================================== -->

<g id="brand">

  <circle cx="130" cy="96" r="5" fill="#3B82F6"/>

  <text
    x="148"
    y="101"
    font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"
    font-size="16"
    font-weight="700"
    letter-spacing="2"
    fill="#FFFFFF">

    WEBTRUSTY

  </text>

  <text
    x="148"
    y="122"
    font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"
    font-size="11"
    letter-spacing="4"
    fill="#60A5FA">

    FRONTEND ENGINEER

  </text>

</g>

<!-- ===================================================== -->
<!-- STATUS -->
<!-- ===================================================== -->

<g>

<rect

x="1350"

y="82"

width="112"

height="34"

rx="17"

fill="#081326"

stroke="#2563EB"

stroke-opacity=".28"/>

<circle
  
id="statusDot"
  
cx="1372"
  
cy="99"
  
r="4"
  
fill="#22C55E"/>

<animate
xlink:href="#statusDot"
attributeName="opacity"
values="1;.35;1"
dur="2s"
repeatCount="indefinite"/>

<text

x="1392"

y="103"

font-family="Inter"

font-size="11"

fill="#FFFFFF">

AVAILABLE

</text>

</g>

<!-- ===================================================== -->
<!-- SECTION -->
<!-- ===================================================== -->

<text

x="800"

y="132"

text-anchor="middle"

font-family="Inter"

font-size="12"

font-weight="600"

letter-spacing="8"

fill="#60A5FA">

PORTFOLIO

</text>

<!-- ===================================================== -->
<!-- MAIN TITLE -->
<!-- ===================================================== -->

<text

x="800"

y="196"

text-anchor="middle"

font-family="Inter"

font-size="64"

font-weight="700"

fill="#FFFFFF">

Crafting Premium

</text>

<text

x="800"

y="252"

text-anchor="middle"

font-family="Inter"

font-size="64"

font-weight="700"

fill="#FFFFFF">

Digital Experiences

</text>

<!-- ===================================================== -->
<!-- SUBTITLE -->
<!-- ===================================================== -->

<text

x="800"

y="292"

text-anchor="middle"

font-family="Inter"

font-size="17"

fill="#CBD5E1">

Frontend Development • Modern UI • Full Stack • AI Integration

</text>

<!-- ===================================================== -->
<!-- DIVIDER -->
<!-- ===================================================== -->

<line

x1="640"

y1="320"

x2="960"

y2="320"

stroke="#2563EB"

stroke-opacity=".30"/>

<circle

cx="800"

cy="320"

r="5"

fill="#60A5FA"/>

<!-- ===================================================== -->
<!-- STACK -->
<!-- ===================================================== -->

<text

x="800"

y="352"

text-anchor="middle"

font-family="Inter"

font-size="13"

letter-spacing="2"

fill="#7DD3FC">

React • Next.js • TypeScript • GSAP • Three.js • Node.js

</text>

<!-- ===================================================== -->
<!-- BOTTOM META -->
<!-- ===================================================== -->

<g>

<line

x1="90"

y1="380"

x2="1510"

y2="380"

stroke="#1E3A8A"

stroke-opacity=".22"/>

<text

x="150"

y="402"

font-family="Inter"

font-size="11"

fill="#64748B"

letter-spacing="3">

PERFORMANCE

</text>

<text

x="520"

y="402"

font-family="Inter"

font-size="11"

fill="#64748B"

letter-spacing="3">

MODERN UI

</text>

<text

x="860"

y="402"

font-family="Inter"

font-size="11"

fill="#64748B"

letter-spacing="3">

FULL STACK

</text>

<text

x="1300"

y="402"

font-family="Inter"

font-size="11"

fill="#64748B"

letter-spacing="3">

AI SYSTEMS

</text>

</g>


  
</svg>
