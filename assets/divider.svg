<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 80" width="1600" height="80">
<defs>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#60A5FA" stop-opacity="0"/>
<stop offset="50%" stop-color="#60A5FA" stop-opacity=".9"/>
<stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
</linearGradient>
<filter id="glow">
<feGaussianBlur stdDeviation="3" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect width="1600" height="80" fill="transparent"/>
<line x1="160" y1="40" x2="1440" y2="40" stroke="url(#line)" stroke-width="2"/>
<circle cx="800" cy="40" r="5" fill="#60A5FA" filter="url(#glow)">
<animate attributeName="cx" values="160;1440;160" dur="8s" repeatCount="indefinite"/>
</circle>
<circle cx="800" cy="40" r="12" fill="none" stroke="#3B82F6" stroke-opacity=".35">
<animate attributeName="r" values="8;20;8" dur="4s" repeatCount="indefinite"/>
<animate attributeName="stroke-opacity" values=".35;0;.35" dur="4s" repeatCount="indefinite"/>
</circle>
<text x="800" y="27" text-anchor="middle" fill="#64748B"
font-family="Inter,Arial" font-size="10" letter-spacing="4">WEBTRUSTY</text>
</svg>
