<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 80" width="1600" height="80" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#60A5FA" stop-opacity="0"/>
    <stop offset="50%" stop-color="#60A5FA" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#60A5FA" stop-opacity="0"/>
    <stop offset="100%" stop-color="#8ecbff" stop-opacity=".9"/>
  </linearGradient>
  <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowSoft" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="1.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1600" height="80" fill="transparent"/>

<!-- base line -->
<line x1="160" y1="40" x2="1440" y2="40" stroke="url(#line)" stroke-width="2"/>

<!-- twinkling star dots along the line -->
<g fill="#8ecbff">
  <circle cx="300" cy="40" r="2.2" opacity=".2">
    <animate attributeName="opacity" values=".2;.9;.2" dur="2.6s" begin=".2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="470" cy="40" r="1.8" opacity=".2">
    <animate attributeName="opacity" values=".2;.8;.2" dur="3.1s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="40" r="2" opacity=".2">
    <animate attributeName="opacity" values=".2;.9;.2" dur="2.3s" begin=".6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="960" cy="40" r="2" opacity=".2">
    <animate attributeName="opacity" values=".2;.9;.2" dur="2.5s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1130" cy="40" r="1.8" opacity=".2">
    <animate attributeName="opacity" values=".2;.8;.2" dur="2.9s" begin=".9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1300" cy="40" r="2.2" opacity=".2">
    <animate attributeName="opacity" values=".2;.9;.2" dur="2.4s" begin="1.9s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- end nodes: diamonds pulsing at both ends -->
<g fill="#60A5FA" filter="url(#glowSoft)">
  <rect x="156" y="36" width="8" height="8" rx="1.5" transform="rotate(45 160 40)">
    <animate attributeName="opacity" values=".4;1;.4" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="1436" y="36" width="8" height="8" rx="1.5" transform="rotate(45 1440 40)">
    <animate attributeName="opacity" values=".4;1;.4" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- comet with trailing streak, sweeping across -->
<g>
  <line x1="0" y1="40" x2="0" y2="40" stroke="url(#trail)" stroke-width="2" stroke-linecap="round">
    <animate attributeName="x1" values="160;1370;160" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="160;1440;160" dur="8s" repeatCount="indefinite"/>
  </line>
  <circle cx="160" cy="40" r="5" fill="#bfe0ff" filter="url(#glow)">
    <animate attributeName="cx" values="160;1440;160" dur="8s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- central node: rotating dashed ring + double pulse + core -->
<g transform="translate(800 40)">
  <circle r="16" fill="none" stroke="#3B82F6" stroke-width="1.2" stroke-dasharray="3 5" opacity=".55">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle r="8" fill="none" stroke="#3B82F6" stroke-opacity=".35">
    <animate attributeName="r" values="8;20;8" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".35;0;.35" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="8" fill="none" stroke="#60A5FA" stroke-opacity=".3">
    <animate attributeName="r" values="8;20;8" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".3;0;.3" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#60A5FA" filter="url(#glow)">
    <animate attributeName="r" values="4;6;4" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>
